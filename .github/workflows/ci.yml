name: Enterprise CI/CD Pipeline - Sistema Café

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  # ============================================================================
  # 1. Backend CI (Spring Boot / Maven / JDK 21)
  # ============================================================================
  backend-test:
    name: Backend CI (Spring Boot 3.3.5 / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests & Code Quality
        run: mvn clean test -B

      - name: Package Application Artifact
        run: mvn package -DskipTests -B

      - name: Upload Backend Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  # ============================================================================
  # 2. Frontend CI (React 19 / TypeScript / Vite / Vitest)
  # ============================================================================
  frontend-test:
    name: Frontend CI (React 19 / TypeScript / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build

  # ============================================================================
  # 3. Python MCP CI (FastMCP / Pytest)
  # ============================================================================
  mcp-service-test:
    name: Python MCP Service CI (Python 3.12 / FastMCP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite & Prompt Security Tests
        run: python -m pytest tests -v

  # ============================================================================
  # 4. Docker Compose & Architecture Validation
  # ============================================================================
  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Spec
        run: docker compose config
