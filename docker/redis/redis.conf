# Redis Configuration for Sistema Café Enterprise
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Strict Limits)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Hybrid RDB + AOF)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance & Logging
loglevel notice
logfile ""
databases 16
