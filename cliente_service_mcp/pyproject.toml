[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-mcp-service"
version = "1.0.0"
description = "Enterprise Coffee Management System - FastMCP Server, Client, Tools and AI Security Guardrails"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Coffee Enterprise Team", email = "devops@sistemacafe.com" }
]
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "pyjwt>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
