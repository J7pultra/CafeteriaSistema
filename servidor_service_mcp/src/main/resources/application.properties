# =========================================================================
# SERVIDOR MCP SPRING AI - SISTEMA CAFÉ ENTERPRISE
# =========================================================================

server.port=${PORT_MCP:8001}
spring.application.name=servidor-service-mcp

# Configuración del Servidor MCP (Spring AI WebFlux)
spring.ai.mcp.server.name=servidor-service-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.transport=sse
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Conexión con el Backend REST de Sistema Café
backend.base-url=${BACKEND_BASE_URL:http://backend:8080}
backend.auth.username=${BACKEND_AUTH_USER:admin}
backend.auth.password=${BACKEND_AUTH_PASS:admin123}

# Logging
logging.level.org.springframework.ai.mcp=INFO
logging.level.org.springframework.web=INFO
logging.level.com.sistemacafe=INFO
server.forward-headers-strategy=framework
